services:
  checkmk:
    image: "checkmk/check-mk-community:2.5.0-latest"
    container_name: "monitoring"
    environment:
      - CMK_PASSWORD=FU#@pac2ya
      - TZ=America/Chicago
    volumes:
      - /docker/checkmk:/omd/sites
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    ports:
      - 8090:5000
      - 8008:8000
    restart: always

volumes:
  monitoring: