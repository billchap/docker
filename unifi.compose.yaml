version: "3.9"
services:
  unifi:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-controller
    network_mode: host
    environment:
      - PUID=1010
      - PGID=1010
      - TZ=America/Chicago
    volumes:
      - /docker/unifi:/config
#    ports:
#      - "3478:3478/udp"
#      - "10001:10001/udp"
#      - "8080:8080"
#      - "8443:8443"
#      - "1900:1900/udp"
#      - "8843:8843"
#      - "8880:8880"
#      - "6789:6789"
    restart: unless-stopped